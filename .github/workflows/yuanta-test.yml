name: 測試元大連線
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 呼叫元大保證金資料介面
        run: |
          curl -sS -m 30 -o yuanta.json -w "HTTP %{http_code} %{content_type}\n" \
            -H "X-Requested-With: XMLHttpRequest" \
            -H "Accept: application/json, text/javascript, */*; q=0.01" \
            "https://www.yuantafutures.com.tw/api/ProcessMargin?type=FR" || true
          echo "前 200 字："
          head -c 200 yuanta.json || true
          echo
      - name: 解析結果
        run: |
          python3 - <<'EOF'
          import json
          try:
              rows = json.load(open('yuanta.json'))['result']
              mgc = next(r for r in rows if r['comno'] == 'MGC')
              print('成功，筆數', len(rows), '｜MGC', mgc['tickamt'], mgc['im'], mgc['mm'])
          except Exception as e:
              print('失敗：', e)
          EOF
