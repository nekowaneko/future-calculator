name: 更新元大保證金
on:
  schedule:
    - cron: '0 22 * * *'  # UTC 22:00 = 臺灣時間每天 06:00（GitHub 排程常會延遲數分鐘到數十分鐘）
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-margins
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 抓取保證金
        run: python3 scripts/fetch_margins.py
      - name: 有變動才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/margins.json
          if git diff --cached --quiet; then
            echo "資料沒有變動"
          else
            git commit -m "更新元大保證金 $(TZ=Asia/Taipei date '+%Y/%m/%d %H:%M')"
            git push
          fi
